<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">缺页中断处理流程</title>
  <desc id="desc">页表中一页有效位为 0，触发缺页中断并从磁盘调页。处理流程先检查访问合法性，再选择牺牲页、写回并调入页面，最后重新执行指令；缺页不等于非法访问。</desc>
  <rect width="1200" height="760" fill="#eee5d6"/>
  <g stroke="#ded2bd" stroke-width="1"><path d="M0 120h1200M0 640h1200"/></g>

  <text x="80" y="82" font-family="Consolas, 'Cascadia Mono', monospace" font-size="18" letter-spacing="5" fill="#8c8168">VIRTUAL MEMORY / PAGE FAULT</text>
  <text x="1120" y="82" text-anchor="end" font-family="Consolas, 'Cascadia Mono', monospace" font-size="14" letter-spacing="3" fill="#8c8168">STANDARD FLOW</text>

  <g fill="#f8f3e8" stroke="#c7bda4" stroke-width="2">
    <rect x="140" y="200" width="260" height="42" rx="3"/>
    <rect x="140" y="254" width="260" height="42" rx="3"/>
    <rect x="140" y="362" width="260" height="42" rx="3"/>
  </g>
  <rect x="140" y="308" width="260" height="42" rx="3" fill="#415a47"/>
  <g font-family="Consolas, 'Cascadia Mono', monospace" font-size="14" fill="#3f5745">
    <text x="158" y="227">P0 → F7&#160;&#160;&#160;&#160;V = 1</text>
    <text x="158" y="281">P1 → F3&#160;&#160;&#160;&#160;V = 1</text>
    <text x="158" y="389">P3 → F5&#160;&#160;&#160;&#160;V = 1</text>
  </g>
  <text x="158" y="335" font-family="Consolas, 'Cascadia Mono', monospace" font-size="14" fill="#f8f3e8">P2 → ??&#160;&#160;&#160;&#160;V = 0</text>
  <text x="270" y="440" text-anchor="middle" font-family="Consolas, 'Cascadia Mono', monospace" font-size="11" letter-spacing="3" fill="#9a8e76">PAGE TABLE + VALID BIT</text>

  <g fill="#f8f3e8" stroke="#415a47" stroke-width="2.5">
    <path d="M470 320h90M470 356h90"/>
    <ellipse cx="515" cy="320" rx="45" ry="10"/>
    <ellipse cx="515" cy="356" rx="45" ry="10"/>
  </g>
  <text x="515" y="392" text-anchor="middle" font-family="Consolas, 'Cascadia Mono', monospace" font-size="11" letter-spacing="3" fill="#9a8e76">DISK</text>
  <g fill="none" stroke="#6a7457" stroke-width="2">
    <path d="M404 329h54M458 329l-9-5M458 329l-9 5"/>
  </g>
  <text x="432" y="316" text-anchor="middle" font-family="Consolas, 'Cascadia Mono', monospace" font-size="10" letter-spacing="2" fill="#6a7457">PAGE IN</text>

  <rect x="660" y="190" width="420" height="58" rx="3" fill="#415a47"/>
  <g fill="#f8f3e8" stroke="#c7bda4" stroke-width="2">
    <rect x="660" y="262" width="420" height="58" rx="3"/>
    <rect x="660" y="334" width="420" height="58" rx="3"/>
    <rect x="660" y="406" width="420" height="58" rx="3"/>
  </g>
  <g font-family="Consolas, 'Cascadia Mono', monospace" font-size="15" letter-spacing="2" text-anchor="middle">
    <text x="870" y="225" fill="#f8f3e8">01 · CHECK ADDRESS VALIDITY</text>
    <text x="870" y="297" fill="#3f5745">02 · PICK VICTIM PAGE IF FULL</text>
    <text x="870" y="369" fill="#3f5745">03 · WRITE BACK DIRTY VICTIM</text>
    <text x="870" y="441" fill="#3f5745">04 · PAGE IN · RESTART</text>
  </g>
  <text x="870" y="500" text-anchor="middle" font-family="Consolas, 'Cascadia Mono', monospace" font-size="11" letter-spacing="3" fill="#9a8e76">OS CHECKS BEFORE PAGING IN</text>

  <text x="600" y="556" text-anchor="middle" font-family="Consolas, 'Cascadia Mono', monospace" font-size="10" letter-spacing="3" fill="#9a8e76">STEP ONE IS A VALIDITY CHECK, NOT AN ABORT</text>
  <text x="600" y="618" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="46" fill="#3f5745">PAGE FAULT ≠ SEGFAULT</text>

  <text x="80" y="680" font-family="Consolas, 'Cascadia Mono', monospace" font-size="12" letter-spacing="3" fill="#9a8e76">VALID BIT = 0 · TRAP TO OS</text>
  <text x="1120" y="680" text-anchor="end" font-family="Consolas, 'Cascadia Mono', monospace" font-size="12" letter-spacing="2" fill="#9a8e76">ABORT ONLY ON ILLEGAL ACCESS</text>
</svg>
