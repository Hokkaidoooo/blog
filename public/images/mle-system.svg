<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">并联模块串联的系统结构</title>
  <desc id="desc">元件 A 与 B 并联组成第一个模块，元件 C 与 D 并联组成第二个模块，两个模块再串联为整个系统，输出系统寿命 T。</desc>
  <rect width="1200" height="420" fill="#eee5d6"/>

  <g fill="none" stroke="#8c8168" stroke-width="2">
    <path d="M80 220h80"/>
    <path d="M160 145v150M160 145h60M160 295h60"/>
    <path d="M380 145h70M380 295h70M450 145v150M450 220h80"/>
    <path d="M530 145v150M530 145h90M530 295h90"/>
    <path d="M780 145h70M780 295h70M850 145v150M850 220h110"/>
  </g>
  <g fill="#f8f3e8" stroke="#c7bda4" stroke-width="2">
    <rect x="220" y="112" width="160" height="66" rx="3"/>
    <rect x="220" y="262" width="160" height="66" rx="3"/>
    <rect x="620" y="112" width="160" height="66" rx="3"/>
    <rect x="620" y="262" width="160" height="66" rx="3"/>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="36" fill="#3f5745" text-anchor="middle">
    <text x="300" y="159">A</text>
    <text x="300" y="309">B</text>
    <text x="700" y="159">C</text>
    <text x="700" y="309">D</text>
  </g>

  <g font-family="Consolas, 'Cascadia Mono', monospace" font-size="13" letter-spacing="3" fill="#8c8168" text-anchor="middle">
    <text x="300" y="72">PARALLEL MODULE 1</text>
    <text x="700" y="72">PARALLEL MODULE 2</text>
  </g>
  <g stroke="#d5c8b2" stroke-width="2" stroke-dasharray="5 9">
    <path d="M490 88v244M860 88v244"/>
  </g>
  <text x="1000" y="213" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="24" fill="#6a7457">T</text>
  <text x="1000" y="238" font-family="Consolas, 'Cascadia Mono', monospace" font-size="11" letter-spacing="2" fill="#9a8e76">SYSTEM LIFE</text>

  <text x="600" y="386" text-anchor="middle" font-family="Consolas, 'Cascadia Mono', monospace" font-size="15" letter-spacing="2" fill="#6a7457">T = min{ max(X₁, X₂),  max(X₃, X₄) }</text>
</svg>
